# Production stack for a single EC2 instance. One paid compute box, three
# containers with clean boundaries: nginx serving the React build and proxying
# the API, Spring Boot, and PostgreSQL.
#
# Only nginx publishes a port, and CloudFront sits in front of it terminating
# TLS. The API and the database are reachable solely on the compose network.
#
# Copy this file and a .env holding the secrets to ~/arena-master on the
# instance, then: docker compose -f compose.prod.yaml up -d

services:
  db:
    image: postgres:18-alpine
    container_name: arena-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arenamaster}
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql, not .../data.
      # This volume lives on the instance's EBS disk.
      - arena-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arena} -d ${POSTGRES_DB:-arenamaster}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Cap local logs so a crash loop can't fill a 20 GB volume.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/days-hub/arena-master-backend:latest}
    container_name: arena-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-arenamaster}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-arena}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # nginx serves the UI on the same origin, so after login send the
      # browser to the site root rather than an absolute URL.
      FRONTEND_BASE_URL: /
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS}
      ARENA_SERVICE_KEY: ${ARENA_SERVICE_KEY}
      RIOT_API_KEY: ${RIOT_API_KEY}
      RIOT_PLATFORM: ${RIOT_PLATFORM:-na1}
      # Sharing 2 GB with nginx and Postgres: leave the JVM room to be a good
      # neighbour rather than sizing it to the whole box.
      JAVA_OPTS: "-XX:MaxRAMPercentage=55"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/days-hub/arena-master-frontend:latest}
    container_name: arena-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # HTTP only: CloudFront terminates TLS. Lock this port to CloudFront's
      # managed origin-facing prefix list in the security group so the origin
      # is not reachable directly.
      - "80:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  arena-pgdata:
