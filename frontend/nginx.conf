server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Spring Boot's endpoints. /oauth2 and /login belong to Spring Security's
    # login flow, and /actuator to the health check, so all four have to reach
    # the backend rather than falling through to the React shell.
    location ~ ^/(api|oauth2|login|actuator)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        # CloudFront terminates TLS and talks to this origin over plain HTTP.
        # Without asserting the original scheme, Spring builds the Discord
        # OAuth redirect_uri as http:// and Discord rejects it for not
        # matching the registered https:// URI.
        proxy_set_header X-Forwarded-Proto https;

        # The OAuth round trip and Discord's API can both be slow.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Hashed filenames, so these can be cached indefinitely.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router owns paths like /profile and /bracket/Summer%20Cup. They are
    # not files on disk, so without this fallback a refresh or a shared link
    # 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or browsers keep loading an old bundle
    # after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
