name: Deploy

# Builds the image, publishes it to GitHub Container Registry, then tells the
# EC2 instance to pull and restart. Dormant until DEPLOY_ENABLED is set to
# 'true', so this can exist before the server does.
#
# GHCR rather than ECR: it is free for public repositories and authenticates
# with the token GitHub already provides, so there are no AWS credentials in
# the pipeline at all.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Build, publish and roll out
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest is what the server tracks; the sha tag makes any running
          # container traceable back to its commit.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull the new image and recreate the app container. Postgres and Caddy
      # are left alone, so this is a rolling restart of the app only.
      - name: Roll out on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/arena-master
            docker compose -f compose.prod.yaml pull app
            docker compose -f compose.prod.yaml up -d app
            docker image prune -f

      - name: Verify the site is healthy
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS "https://${{ vars.ARENA_DOMAIN }}/actuator/health" | grep -q '"status":"UP"'; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 10
          done
          echo "Site did not report healthy after the rollout." >&2
          exit 1

      - name: Summary
        if: success()
        run: |
          echo "### Deployed \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ vars.ARENA_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"
