name: Deploy

# Publishes both images to GitHub Container Registry, then tells the EC2
# instance to pull and restart. Dormant until DEPLOY_ENABLED is set to 'true',
# so this can exist before the server does.
#
# GHCR rather than ECR: free for public repositories and authenticated by the
# token GitHub already issues, so no AWS credentials live in the pipeline.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and publish images
    # Must match the Graviton instance's architecture — an x86 image will not
    # run there. Free for public repositories.
    runs-on: ubuntu-24.04-arm
    if: vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./springboot-server
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # :latest is what the instance tracks; the sha tag makes a running
          # container traceable back to its commit.
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  rollout:
    name: Roll out on EC2
    runs-on: ubuntu-latest
    needs: build
    # Separate flag from DEPLOY_ENABLED so images can be published before the
    # server exists — the instance has to pull them from somewhere on its
    # first start, which is a chicken-and-egg otherwise.
    if: vars.ROLLOUT_ENABLED == 'true'
    steps:
      # Pull the new images and recreate the app containers. Postgres is left
      # untouched, so this never risks the data.
      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/arena-master
            docker compose -f compose.prod.yaml pull backend frontend
            docker compose -f compose.prod.yaml up -d backend frontend
            docker image prune -f

      # A deploy that silently breaks the site is not a deploy.
      - name: Verify the site is healthy
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS "https://${{ vars.ARENA_DOMAIN }}/actuator/health" | grep -q '"status":"UP"'; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 10
          done
          echo "Site did not report healthy after the rollout." >&2
          exit 1

      - name: Summary
        if: success()
        run: |
          echo "### Deployed \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ vars.ARENA_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"
