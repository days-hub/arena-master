name: Deploy

# Builds both images, publishes them to GitHub Container Registry, then tells
# the instance to pull and restart via AWS Systems Manager.
#
# SSM rather than SSH: the instance's security group only allows inbound HTTP
# from CloudFront, and GitHub's runners have no fixed egress addresses to
# allow-list — GitHub publishes thousands of CIDRs and a security group caps
# at 60 rules. The SSM agent connects outbound to AWS instead, so deployment
# needs no inbound port at all.
#
# GHCR rather than ECR: free for public repositories and authenticated by the
# token GitHub already issues.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and publish images
    # Must match the Graviton instance's architecture — an x86 image will not
    # run there. Free for public repositories.
    runs-on: ubuntu-24.04-arm
    if: vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./springboot-server
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # :latest is what the instance tracks; the sha tag makes a running
          # container traceable back to its commit.
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  rollout:
    name: Roll out on EC2
    runs-on: ubuntu-latest
    needs: build
    if: vars.ROLLOUT_ENABLED == 'true'

    # id-token lets GitHub mint an OIDC token that AWS trusts, so there are no
    # long-lived AWS keys stored in this repository.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Assume the deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Pull the new images and recreate the app containers. Postgres is left
      # alone, so a deploy never risks the data.
      - name: Pull and restart via SSM
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ec2-user/arena-master",
              "docker compose -f compose.prod.yaml pull backend frontend",
              "docker compose -f compose.prod.yaml up -d backend frontend",
              "docker image prune -f"
            ]' \
            --query 'Command.CommandId' --output text)

          echo "SSM command: $COMMAND_ID"

          # `wait` exits non-zero when the command itself failed; swallow that
          # so the status and output below can be reported properly.
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.INSTANCE_ID }}" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.INSTANCE_ID }}" \
            --query 'Status' --output text)

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.INSTANCE_ID }}" \
            --query 'StandardOutputContent' --output text

          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---" >&2
            aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.INSTANCE_ID }}" \
              --query 'StandardErrorContent' --output text >&2
            echo "SSM command finished as $STATUS" >&2
            exit 1
          fi

      # A deploy that silently breaks the site is not a deploy.
      - name: Verify the site is healthy
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS "https://${{ vars.ARENA_DOMAIN }}/actuator/health" | grep -q '"status":"UP"'; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 10
          done
          echo "Site did not report healthy after the rollout." >&2
          exit 1

      - name: Summary
        if: success()
        run: |
          echo "### Deployed \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ vars.ARENA_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"
