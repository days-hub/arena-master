name: CI

# Runs on every push and pull request. Deployment lives in deploy.yml so that
# a broken build can never reach production.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The context-load test starts a real PostgreSQL through Testcontainers,
      # which is why this needs the Docker that GitHub's runners provide.
      - name: Run tests
        working-directory: springboot-server
        run: ./mvnw -B -ntp test

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test -- --watchAll=false
        env:
          CI: true

  images:
    name: Container images build
    runs-on: ubuntu-latest
    # No point building images if the code inside them is broken.
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - name: backend
            context: ./springboot-server
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — publishing is deploy.yml's job. This exists so a
      # Dockerfile mistake fails here rather than during a deploy.
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
