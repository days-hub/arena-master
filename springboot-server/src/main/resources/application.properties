spring.application.name=arena-master-api

# Reuse the repo-root .env (the same file the Python stack reads) as a
# property source; real environment variables still take precedence.
spring.config.import=optional:file:../.env[.properties]

# --- Discord (see DiscordProperties) ---
discord.bot-token=${DISCORD_BOT_TOKEN:}
discord.guild-id=${DISCORD_GUILD_ID:}
discord.webhook-url=${DISCORD_WEBHOOK_URL:}

# --- CORS: wide open in dev, restrict to the real frontend origin in prod ---
app.cors.allowed-origins=*

# Where to send the browser after a successful Discord login.
app.frontend-url=${FRONTEND_BASE_URL:http://localhost:3000}

# --- Discord OAuth2 login ---
# Client id/secret come from the Discord Developer Portal (OAuth2 tab) and are
# NOT the bot token. Register this redirect URI there:
#   http://localhost:8000/login/oauth2/code/discord
# Left blank the app still starts, just without a login option (see
# DiscordOAuthConfig) — an unconfigured integration shouldn't down the API.
discord.oauth.client-id=${DISCORD_CLIENT_ID:}
discord.oauth.client-secret=${DISCORD_CLIENT_SECRET:}

# Comma-separated Discord user ids granted admin at login. Config rather than
# a database flag so a fresh deployment can bootstrap its first admin.
app.admin-discord-ids=${ADMIN_DISCORD_IDS:}

# Shared secret for the Discord bot (see ServiceKeyAuthFilter). Blank disables
# service authentication entirely.
app.service-key=${ARENA_SERVICE_KEY:}

# Same port the FastAPI server used, so the React app and Discord bot
# work against either backend without any config change.
server.port=8000

# --- Datasource (matches compose.yaml; Boot auto-starts that compose file in dev) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/arenamaster
spring.datasource.username=arena
spring.datasource.password=arena

# --- JPA ---
# Flyway owns the schema; Hibernate only verifies entities line up with it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Log SQL while we're building; drop to false once the port is proven.
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
