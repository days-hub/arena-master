spring.application.name=arena-master-api

# Reuse the repo-root .env (the same file the Python stack reads) as a
# property source; real environment variables still take precedence.
spring.config.import=optional:file:../.env[.properties]

# --- Discord (see DiscordProperties) ---
discord.bot-token=${DISCORD_BOT_TOKEN:}
discord.guild-id=${DISCORD_GUILD_ID:}
discord.webhook-url=${DISCORD_WEBHOOK_URL:}

# --- CORS: wide open in dev, restrict to the real frontend origin in prod ---
app.cors.allowed-origins=*

# Same port the FastAPI server used, so the React app and Discord bot
# work against either backend without any config change.
server.port=8000

# --- Datasource (matches compose.yaml; Boot auto-starts that compose file in dev) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/arenamaster
spring.datasource.username=arena
spring.datasource.password=arena

# --- JPA ---
# Flyway owns the schema; Hibernate only verifies entities line up with it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Log SQL while we're building; drop to false once the port is proven.
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
