# Production profile: activated with SPRING_PROFILES_ACTIVE=prod.
# Everything environment-specific still comes from environment variables; this
# file only holds settings that differ by *how* the app runs, not by where.

# The container has no Docker daemon and no compose file — the database is a
# managed instance reached over the network.
spring.docker.compose.enabled=false

# Behind a load balancer that terminates TLS, the app sees plain HTTP. Without
# honouring X-Forwarded-*, Spring builds the OAuth redirect_uri as http://...,
# which Discord then rejects for not matching the registered https:// URI.
server.forward-headers-strategy=framework

# The SQL logging that is useful locally is noise in production.
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=warn

# The React build is served from this same origin, so no cross-site cookie
# handling is needed and the session cookie can be strict.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Compress the JS bundle on the way out; it is by far the largest response.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=2KB
